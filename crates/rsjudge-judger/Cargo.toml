[package]
name = "rsjudge-judger"
version.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.2"
futures = "0.3.34"
rsjudge-runner = { path = "../rsjudge-runner", version = "0.1.0" }
rsjudge-test-cases-schema = { path = "../../schemas/test-cases-schema/rust-serde-impl" }
rsjudge-traits.workspace = true
rsjudge-utils.workspace = true
serde.workspace = true
shell-words = "1.1.1"
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { workspace = true, features = [
    "io-util",
    "fs",
    "macros",
    "process",
    "rt",
    "time",
] }
toml = "1.2.1"
zstd = "0.14"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt-multi-thread", "full"] }
toml = "1.2.1"
