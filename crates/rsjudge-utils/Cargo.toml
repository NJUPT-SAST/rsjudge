[package]
name = "rsjudge-utils"
version.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { workspace = true, features = [
    "process",
    "macros",
    "rt-multi-thread",
] }

[dev-dependencies]
# The log_if_error! macro expands to ::log::error! in the caller crate, so a
# doctest that exercises the macro needs the logging facade for itself.
anyhow = "1.0.104"
log.workspace = true
