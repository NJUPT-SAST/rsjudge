# --- Judge hardening ------------------------------------------------------
# The rules below kill the process on syscalls that judged programs have no
# legitimate use for, covering network access, permission/identity changes,
# mount/namespace operations, cross-process memory access, and kernel attack
# surface. Unknown syscalls still receive ENOSYS from the default action,
# which lets language runtimes probe for features and fall back gracefully.

# Network access. `socketpair` stays allowed: it only creates AF_UNIX pairs
# and some runtimes use it internally.
[[syscalls]]
names = [
    "accept",
    "accept4",
    "bind",
    "connect",
    "getpeername",
    "getsockname",
    "getsockopt",
    "listen",
    "recv",
    "recvfrom",
    "recvmmsg",
    "recvmmsg_time64",
    "recvmsg",
    "send",
    "sendmmsg",
    "sendmsg",
    "sendto",
    "setsockopt",
    "shutdown",
    "socket",
    "socketcall",
]
action = "SCMP_ACT_KILL_PROCESS"

# File permission and ownership changes.
[[syscalls]]
names = [
    "chmod",
    "chown",
    "chown32",
    "fchmod",
    "fchmodat",
    "fchmodat2",
    "fchown",
    "fchown32",
    "fchownat",
    "lchown",
    "lchown32",
]
action = "SCMP_ACT_KILL_PROCESS"

# Process identity changes.
[[syscalls]]
names = [
    "capset",
    "setfsgid",
    "setfsgid32",
    "setfsuid",
    "setfsuid32",
    "setgid",
    "setgid32",
    "setgroups",
    "setgroups32",
    "setregid",
    "setregid32",
    "setresgid",
    "setresgid32",
    "setresuid",
    "setresuid32",
    "setreuid",
    "setreuid32",
    "setuid",
    "setuid32",
]
action = "SCMP_ACT_KILL_PROCESS"

# Mount and namespace operations.
[[syscalls]]
names = [
    "fsconfig",
    "fsmount",
    "fsopen",
    "fspick",
    "mount",
    "mount_setattr",
    "move_mount",
    "name_to_handle_at",
    "open_tree",
    "pivot_root",
    "setns",
    "umount",
    "umount2",
    "unshare",
]
action = "SCMP_ACT_KILL_PROCESS"

# Cross-process memory access and debugging.
[[syscalls]]
names = [
    "pidfd_getfd",
    "process_vm_readv",
    "process_vm_writev",
    "ptrace",
]
action = "SCMP_ACT_KILL_PROCESS"

# Kernel attack surface.
[[syscalls]]
names = [
    "keyctl",
    "reboot",
    "syslog",
]
action = "SCMP_ACT_KILL_PROCESS"

